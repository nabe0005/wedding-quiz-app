<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI未来予測 - 司会者画面</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="gate" class="gate">
  <div class="card">
    <h2 class="title" style="font-size:20px; color:var(--ink); text-shadow:none;">司会者ログイン</h2>
    <p class="small-note">操作パスワードを入力してください。</p>
    <input type="password" id="pwInput" placeholder="パスワード" style="margin-top:12px;">
    <button id="pwSubmit" class="btn-primary btn-block" style="margin-top:12px;">入る</button>
    <p class="error-text" id="pwError" style="display:none;">パスワードが違います。</p>
  </div>
</div>

<div id="main" class="wrap host" style="display:none;">
  <div class="eyebrow">新郎新婦クイズ★</div>
  <h1 class="title">司会者コントロールパネル</h1>

  <div class="card">
    <div class="row">
      <div><span class="status-pill">参加人数：<b id="participantCount">0</b>人</span></div>
      <div style="text-align:right;"><span class="status-pill" id="statusPill">待機中</span></div>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size:16px;">問題の編集</h3>
    <div id="questionEditors"></div>
    <button id="addQuestionBtn" class="btn-secondary btn-block" style="margin-top:14px;">＋ 問題を追加</button>
    <button id="saveQuestionsBtn" class="btn-primary btn-block" style="margin-top:10px;">この内容を保存</button>
    <p class="small-note" id="saveMsg" style="display:none; color:var(--pink-deep);">保存しました。</p>
  </div>

  <div class="card">
    <h3 style="font-size:16px;">進行操作 — 第<span id="currentQNum">1</span>問</h3>
    <div class="row" style="margin-top:10px;">
      <button id="startBtn" class="btn-primary">投票受付開始</button>
      <button id="closeBtn" class="btn-secondary">締切</button>
    </div>
    <div class="row" style="margin-top:10px;">
      <button id="revealBtn" class="btn-secondary">結果を公開</button>
      <button id="nextBtn" class="btn-secondary">次の問題へ</button>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size:16px;">リアルタイム集計</h3>
    <div id="tallyArea"></div>
    <p class="small-note" id="totalVotesNote">投票数：0</p>
  </div>

  <div class="card">
    <h3 style="font-size:16px;">各問題の最多回答</h3>
    <div id="summaryArea" class="small-note">問題を保存すると、ここに表示されます。</div>
  </div>

  <div class="card">
    <h3 style="font-size:16px;">正解ランキング</h3>
    <button id="rankingBtn" class="btn-primary btn-block">順位を表示する</button>
    <ol id="rankingList" class="ranking-list"></ol>
    <h4 style="font-size:13px; margin-top:16px;">参加者一覧</h4>
    <ul class="participant-list" id="participantList"></ul>
  </div>

  <div class="card">
    <h3 style="font-size:16px; color:var(--red);">終了処理</h3>
    <p class="small-note">余興終了後、投票・参加者データを完全に削除します（元に戻せません）。</p>
    <button id="resetBtn" class="btn-danger btn-block">投票データを全削除する</button>
  </div>
</div>

<script type="module">
import { firebaseConfig } from './js/firebase-config.js';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, update, onValue, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const gate = document.getElementById('gate');
const main = document.getElementById('main');
const pwInput = document.getElementById('pwInput');
const pwSubmit = document.getElementById('pwSubmit');
const pwError = document.getElementById('pwError');

let myUid = null;
let currentSession = { status: 'waiting', currentQuestionIndex: 0 };
let currentQuestions = [];      // 保存済み（DBの最新データ）
let editingQuestions = [];      // 編集中のローカルコピー
let currentParticipants = {};

signInAnonymously(auth).catch(e => console.error(e));
onAuthStateChanged(auth, (user) => { if (user) myUid = user.uid; });

pwSubmit.addEventListener('click', async () => {
  if (!myUid) { alert('接続中です。数秒待って再度お試しください。'); return; }
  const pw = pwInput.value;
  if (!pw) return;
  try {
    await set(ref(db, `hostClaim/${myUid}`), pw);
    pwError.style.display = 'none';
    gate.style.display = 'none';
    main.style.display = 'block';
    initHostDashboard();
  } catch (e) {
    pwError.style.display = 'block';
    console.error(e);
  }
});

function initHostDashboard() {
  listenParticipants();
  listenSession();
  listenQuestionsForEditor();
  listenVotesForTally();

  document.getElementById('startBtn').onclick = (e) => { flashButton(e.currentTarget); updateSession({ status: 'voting' }); showToast('投票受付を開始しました'); };
  document.getElementById('closeBtn').onclick = (e) => { flashButton(e.currentTarget); updateSession({ status: 'closed' }); showToast('締切りました'); };
  document.getElementById('revealBtn').onclick = (e) => { flashButton(e.currentTarget); updateSession({ status: 'revealed' }); showToast('結果を公開しました'); };
  document.getElementById('nextBtn').onclick = (e) => { flashButton(e.currentTarget); onNextQuestion(); };
  document.getElementById('saveQuestionsBtn').onclick = (e) => { flashButton(e.currentTarget); saveQuestions(); };
  document.getElementById('addQuestionBtn').onclick = (e) => { flashButton(e.currentTarget); addQuestion(); };
  document.getElementById('rankingBtn').onclick = (e) => { flashButton(e.currentTarget); showRanking(); };
  document.getElementById('resetBtn').onclick = (e) => { flashButton(e.currentTarget); resetAllData(); };
}

function flashButton(el) {
  if (!el) return;
  el.classList.remove('btn-flash');
  void el.offsetWidth;
  el.classList.add('btn-flash');
}

function showToast(msg) {
  let toast = document.getElementById('toastMsg');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toastMsg';
    toast.className = 'toast-msg';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}

function updateSession(patch) {
  update(ref(db, 'session'), patch).catch(e => alert('更新に失敗しました: ' + e.message));
}

async function onNextQuestion() {
  const next = (currentSession.currentQuestionIndex || 0) + 1;
  if (next >= currentQuestions.length) {
    alert('最後の問題です。正解ランキングを表示しましょう。');
    return;
  }
  await update(ref(db, 'session'), { status: 'waiting', currentQuestionIndex: next });
  showToast(`第${next + 1}問に進みました`);
}

/* ---------- 問題エディタ（自由に追加・削除できる） ---------- */

function buildQuestionEditors() {
  const container = document.getElementById('questionEditors');
  container.innerHTML = '';
  editingQuestions.forEach((q, i) => {
    const box = document.createElement('div');
    box.className = 'question-edit-block';
    box.innerHTML = `
      <div class="qe-header">
        <label>第${i + 1}問 - 問題文</label>
        <button type="button" class="qe-remove" data-idx="${i}">× 削除</button>
      </div>
      <input type="text" class="qe-text" data-idx="${i}" value="${escapeAttr(q.text || '')}" placeholder="例：新郎の小学生時代の習い事は？">
      <div style="margin-top:8px;">
        ${[0, 1, 2, 3].map(j => `
          <div class="qe-option-row">
            <input type="text" class="qe-opt" data-idx="${i}" data-opt="${j}" value="${escapeAttr((q.options && q.options[j]) || '')}" placeholder="選択肢${'ABCD'[j]}">
            <label class="qe-correct-label">
              <input type="radio" name="correct-${i}" class="qe-correct" data-idx="${i}" data-opt="${j}" ${q.correctIndex === j ? 'checked' : ''}>
              正解
            </label>
          </div>
        `).join('')}
        <label class="qe-correct-label qe-correct-none">
          <input type="radio" name="correct-${i}" class="qe-correct-none-radio" data-idx="${i}" ${q.correctIndex === null || q.correctIndex === undefined ? 'checked' : ''}>
          正解なし（予想・未来の問題など）
        </label>
      </div>
    `;
    container.appendChild(box);
  });

  container.querySelectorAll('.qe-text').forEach(el => el.addEventListener('input', e => {
    editingQuestions[+e.target.dataset.idx].text = e.target.value;
  }));
  container.querySelectorAll('.qe-opt').forEach(el => el.addEventListener('input', e => {
    const idx = +e.target.dataset.idx, opt = +e.target.dataset.opt;
    if (!editingQuestions[idx].options) editingQuestions[idx].options = ['', '', '', ''];
    editingQuestions[idx].options[opt] = e.target.value;
  }));
  container.querySelectorAll('.qe-correct').forEach(el => el.addEventListener('change', e => {
    editingQuestions[+e.target.dataset.idx].correctIndex = +e.target.dataset.opt;
  }));
  container.querySelectorAll('.qe-correct-none-radio').forEach(el => el.addEventListener('change', e => {
    editingQuestions[+e.target.dataset.idx].correctIndex = null;
  }));
  container.querySelectorAll('.qe-remove').forEach(el => el.addEventListener('click', e => {
    const idx = +e.target.dataset.idx;
    editingQuestions.splice(idx, 1);
    buildQuestionEditors();
  }));
}

function addQuestion() {
  editingQuestions.push({ text: '', options: ['', '', '', ''], correctIndex: null });
  buildQuestionEditors();
}

function listenQuestionsForEditor() {
  onValue(ref(db, 'questions'), (snap) => {
    currentQuestions = snap.val() || [];
    editingQuestions = currentQuestions.map(q => ({
      text: q.text || '',
      options: (q.options && q.options.length === 4) ? [...q.options] : ['', '', '', ''],
      correctIndex: (q.correctIndex === 0 || q.correctIndex > 0) ? q.correctIndex : null
    }));
    if (editingQuestions.length === 0) editingQuestions.push({ text: '', options: ['', '', '', ''], correctIndex: null });
    buildQuestionEditors();
    renderTallyForCurrentQuestion();
    renderSummary();
  });
}

async function saveQuestions() {
  try {
    await set(ref(db, 'questions'), editingQuestions);
    const msg = document.getElementById('saveMsg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2000);
  } catch (e) {
    alert('保存に失敗しました: ' + e.message);
  }
}

/* ---------- 進行状況 ---------- */

function listenSession() {
  onValue(ref(db, 'session'), (snap) => {
    const val = snap.val() || { status: 'waiting', currentQuestionIndex: 0 };
    currentSession = val;
    document.getElementById('currentQNum').textContent = (val.currentQuestionIndex || 0) + 1;
    const pill = document.getElementById('statusPill');
    pill.className = 'status-pill ' + (val.status || 'waiting');
    pill.textContent =
      val.status === 'voting' ? '投票受付中' :
      val.status === 'closed' ? '締切' :
      val.status === 'revealed' ? '結果発表' : '待機中';
    listenVotesForTally();
  });
}

function listenParticipants() {
  onValue(ref(db, 'participants'), (snap) => {
    currentParticipants = snap.val() || {};
    const ids = Object.keys(currentParticipants);
    document.getElementById('participantCount').textContent = ids.length;
    const list = document.getElementById('participantList');
    list.innerHTML = '';
    ids.forEach(uid => {
      const p = currentParticipants[uid];
      const li = document.createElement('li');
      li.innerHTML = `<span>${escapeHtml(p.nickname || '名無し')}</span>`;
      list.appendChild(li);
    });
  });
}

let currentVoteUnsub = null;
function listenVotesForTally() {
  const qIndex = currentSession.currentQuestionIndex || 0;
  if (currentVoteUnsub) currentVoteUnsub();
  currentVoteUnsub = onValue(ref(db, `votes/${qIndex}`), () => {
    renderTallyForCurrentQuestion();
    renderSummary();
  });
}

async function renderTallyForCurrentQuestion() {
  const qIndex = currentSession.currentQuestionIndex || 0;
  const q = currentQuestions[qIndex];
  const snap = await get(child(ref(db), `votes/${qIndex}`));
  const votes = snap.val() || {};
  const counts = [0, 0, 0, 0];
  Object.values(votes).forEach(v => { if (v >= 0 && v <= 3) counts[v]++; });
  const total = counts.reduce((a, b) => a + b, 0);
  const showCorrect = currentSession.status === 'revealed' && q && (q.correctIndex === 0 || q.correctIndex > 0);

  const area = document.getElementById('tallyArea');
  area.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const pct = total > 0 ? Math.round((counts[i] / total) * 100) : 0;
    const optText = q?.options?.[i] || `選択肢${'ABCD'[i]}`;
    const isCorrect = showCorrect && q.correctIndex === i;
    const row = document.createElement('div');
    row.className = 'bar-row' + (isCorrect ? ' correct-answer' : '');
    row.innerHTML = `
      <div class="bar-label"><span>${'ABCD'[i]}. ${escapeHtml(optText)}${isCorrect ? '<span class="correct-badge">★正解</span>' : ''}</span><span>${counts[i]}票（${pct}%）</span></div>
      <div class="bar-track"><div class="bar-fill opt-${i}" style="width:${pct}%;"></div></div>
    `;
    area.appendChild(row);
  }
  document.getElementById('totalVotesNote').textContent = `投票数：${total}`;
}

async function renderSummary() {
  const area = document.getElementById('summaryArea');
  if (!currentQuestions.length) { area.textContent = '問題を保存すると、ここに表示されます。'; return; }
  let html = '';
  for (let qi = 0; qi < currentQuestions.length; qi++) {
    const snap = await get(child(ref(db), `votes/${qi}`));
    const votes = snap.val() || {};
    const counts = [0, 0, 0, 0];
    Object.values(votes).forEach(v => { if (v >= 0 && v <= 3) counts[v]++; });
    const total = counts.reduce((a, b) => a + b, 0);
    const topIndex = counts.indexOf(Math.max(...counts));
    const q = currentQuestions[qi];
    const topText = total > 0 ? (q?.options?.[topIndex] || '---') : 'まだ投票なし';
    html += `<div style="margin-top:6px;">第${qi + 1}問「${escapeHtml(q?.text || '')}」→ 最多：<b style="color:var(--pink-deep);">${escapeHtml(topText)}</b></div>`;
  }
  area.innerHTML = html;
}

/* ---------- 正解ランキング ---------- */

async function showRanking() {
  const scores = {};
  Object.keys(currentParticipants).forEach(uid => { scores[uid] = 0; });

  for (let qi = 0; qi < currentQuestions.length; qi++) {
    const q = currentQuestions[qi];
    if (q.correctIndex !== 0 && !(q.correctIndex > 0)) continue; // 正解なしの問題はスキップ
    const snap = await get(child(ref(db), `votes/${qi}`));
    const votes = snap.val() || {};
    Object.entries(votes).forEach(([uid, v]) => {
      if (v === q.correctIndex) scores[uid] = (scores[uid] || 0) + 1;
      else if (!(uid in scores)) scores[uid] = 0;
    });
  }

  const rows = Object.keys(currentParticipants).map(uid => ({
    nickname: currentParticipants[uid].nickname || '名無し',
    score: scores[uid] || 0
  }));
  rows.sort((a, b) => b.score - a.score);

  let rank = 0, prevScore = null;
  const list = document.getElementById('rankingList');
  list.innerHTML = '';
  rows.forEach((r, i) => {
    if (r.score !== prevScore) { rank = i + 1; prevScore = r.score; }
    const li = document.createElement('li');
    li.className = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `${rank}位`;
    li.innerHTML = `<span class="rank-num">${medal}</span><span>${escapeHtml(r.nickname)}</span><span class="rank-score">${r.score}問正解</span>`;
    list.appendChild(li);
  });
  if (rows.length === 0) list.innerHTML = '<li>参加者がいません</li>';
}

/* ---------- 終了処理 ---------- */

async function resetAllData() {
  if (!confirm('本当に全データを削除しますか？この操作は取り消せません。')) return;
  if (!confirm('最終確認：投票・参加者・抽選結果のすべてを削除します。よろしいですか？')) return;
  try {
    await update(ref(db), {
      session: { status: 'waiting', currentQuestionIndex: 0 },
      questions: null,
      participants: null,
      votes: null
    });
    alert('データを削除しました。');
    location.reload();
  } catch (e) {
    alert('削除に失敗しました: ' + e.message);
  }
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = String(str ?? '');
  return d.innerHTML;
}
function escapeAttr(str) {
  return String(str ?? '').replace(/"/g, '&quot;');
}
</script>
</body>
</html>
